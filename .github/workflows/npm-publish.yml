name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # Mandatory for npm Trusted Publishing OIDC token minting
  contents: read  # Required for checking out repository code

jobs:
  publish:
    name: Build, Test & Publish to npm
    runs-on: ubuntu-latest
    # If you configured an environment name (e.g. 'npm-publish') in npmjs.com Trusted Publisher settings,
    # uncomment the line below. If you left Environment blank on npmjs.com, keep it commented.
    # environment: npm-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22+ with npm 11+ for Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # Clean install on release builds

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build TypeScript distribution
        run: npm run build

      - name: Publish to npm (Provenance enabled via OIDC)
        run: npm publish --access public --provenance
